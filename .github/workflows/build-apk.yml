name: Build Android APK & Release

on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Configure Android SDK & Licenses
        run: |
          SDK_DIR="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          if [ -d "$SDK_DIR" ]; then
            sudo chown -R "$(id -u):$(id -g)" "$SDK_DIR" 2>/dev/null || true
          else
            mkdir -p "$SDK_DIR"
          fi

          SDKMANAGER=""
          if [ -x "$SDK_DIR/cmdline-tools/latest/bin/sdkmanager" ]; then
            SDKMANAGER="$SDK_DIR/cmdline-tools/latest/bin/sdkmanager"
          else
            SDKMANAGER=$(find "$SDK_DIR/cmdline-tools" -maxdepth 3 -type f -name sdkmanager 2>/dev/null | sort -V | tail -n 1 || true)
          fi

          if [ -z "$SDKMANAGER" ]; then
            mkdir -p "$SDK_DIR/cmdline-tools"
            curl -fsSL https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -o /tmp/cmdtools.zip
            unzip -q /tmp/cmdtools.zip -d /tmp/cmdtools-extract
            mv /tmp/cmdtools-extract/cmdline-tools "$SDK_DIR/cmdline-tools/latest"
            SDKMANAGER="$SDK_DIR/cmdline-tools/latest/bin/sdkmanager"
          fi

          echo "ANDROID_HOME=$SDK_DIR" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_DIR" >> "$GITHUB_ENV"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          echo "$SDK_DIR/platform-tools" >> "$GITHUB_PATH"

          (yes || true) | "$SDKMANAGER" --sdk_root="$SDK_DIR" --licenses >/dev/null || true
          (yes || true) | "$SDKMANAGER" --sdk_root="$SDK_DIR" "platform-tools" >/dev/null || true
          (yes || true) | "$SDKMANAGER" --sdk_root="$SDK_DIR" "build-tools;36.0.0" >/dev/null || true
          (yes || true) | "$SDKMANAGER" --sdk_root="$SDK_DIR" "platforms;android-36.1" >/dev/null || \
            (yes || true) | "$SDKMANAGER" --sdk_root="$SDK_DIR" "platforms;android-36" >/dev/null || true
          (yes || true) | "$SDKMANAGER" --sdk_root="$SDK_DIR" --licenses >/dev/null || true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
          validate-wrappers: false

      - name: Prepare debug keystore
        run: |
          if [ -f debug.keystore.base64 ] && [ ! -f debug.keystore ]; then
            tr -d '[:space:]' < debug.keystore.base64 | base64 -d > debug.keystore
          elif [ ! -f debug.keystore ]; then
            keytool -genkeypair -v \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Ensure .env exists
        run: |
          if [ ! -f .env ] && [ -f .env.example ]; then
            cp .env.example .env
          elif [ ! -f .env ]; then
            touch .env
          fi

      - name: Resolve Release Version & Tag (Auto-increment patch if tag exists)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          BASE_VERSION=$(grep -E 'versionName\s*=\s*"[^"]+"' app/build.gradle.kts | head -n 1 | sed -E 's/.*"([^"]+)".*/\1/')
          if [ -z "$BASE_VERSION" ]; then
            BASE_VERSION="2.5"
          fi
          BASE_CODE=$(grep -E 'versionCode\s*=\s*[0-9]+' app/build.gradle.kts | head -n 1 | sed -E 's/[^0-9]*([0-9]+).*/\1/')
          if [ -z "$BASE_CODE" ]; then
            BASE_CODE="6"
          fi

          FINAL_VERSION="$BASE_VERSION"
          FINAL_CODE="$BASE_CODE"
          FINAL_TAG="v${FINAL_VERSION}"

          if gh release view "$FINAL_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || git rev-parse "$FINAL_TAG" >/dev/null 2>&1; then
            PATCH=1
            # Extract major.minor prefix (e.g. 2.5 from 2.5 or 2.5.x)
            MAJOR_MINOR=$(echo "$BASE_VERSION" | awk -F. '{print $1"."$2}')
            while [ "$PATCH" -le 500 ]; do
              CANDIDATE_VER="${MAJOR_MINOR}.${PATCH}"
              CANDIDATE_TAG="v${CANDIDATE_VER}"
              if ! gh release view "$CANDIDATE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 && ! git rev-parse "$CANDIDATE_TAG" >/dev/null 2>&1; then
                FINAL_VERSION="$CANDIDATE_VER"
                FINAL_TAG="$CANDIDATE_TAG"
                FINAL_CODE=$((BASE_CODE + PATCH))
                break
              fi
              PATCH=$((PATCH + 1))
            done

            sed -i -E "s/versionName\s*=\s*\"[^\"]+\"/versionName = \"${FINAL_VERSION}\"/" app/build.gradle.kts
            sed -i -E "s/versionCode\s*=\s*[0-9]+/versionCode = ${FINAL_CODE}/" app/build.gradle.kts
            if [ -f app/src/main/java/com/example/model/PlayerModels.kt ]; then
              sed -i -E "s/const val VERSION_NAME = \"[^\"]+\"/const val VERSION_NAME = \"${FINAL_VERSION}\"/" app/src/main/java/com/example/model/PlayerModels.kt
              sed -i -E "s/const val VERSION_CODE = [0-9]+/const val VERSION_CODE = ${FINAL_CODE}/" app/src/main/java/com/example/model/PlayerModels.kt
              sed -i -E "s/const val BADGE_TEXT = \"[^\"]+\"/const val BADGE_TEXT = \"${FINAL_TAG}\"/" app/src/main/java/com/example/model/PlayerModels.kt
              sed -i -E "s/const val RELEASE_TAG = \"[^\"]+\"/const val RELEASE_TAG = \"${FINAL_TAG}\"/" app/src/main/java/com/example/model/PlayerModels.kt
            fi
          fi

          echo "RESOLVED_VERSION_NAME=${FINAL_VERSION}" >> "$GITHUB_ENV"
          echo "RESOLVED_RELEASE_TAG=${FINAL_TAG}" >> "$GITHUB_ENV"
          echo "Resolved release tag: ${FINAL_TAG} (versionName=${FINAL_VERSION}, versionCode=${FINAL_CODE})"

      - name: Build Debug APK
        run: gradle :app:assembleDebug --no-daemon --no-configuration-cache -Pandroid.builder.sdkDownload=true --stacktrace

      - name: Prepare negai.apk
        run: |
          APK_PATH=$(find app/build/outputs/apk/debug -type f -name "*.apk" | head -n 1)
          if [ -z "$APK_PATH" ] || [ ! -s "$APK_PATH" ]; then
            echo "Error: Signed APK not found or empty in app/build/outputs/apk/debug"
            exit 1
          fi
          cp "$APK_PATH" negai.apk
          ls -lh negai.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: negai-apk
          path: negai.apk

      - name: Create GitHub Release & Upload negai.apk
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          if [ ! -s negai.apk ]; then
            echo "Error: negai.apk is missing before release upload!"
            exit 1
          fi

          TAG="${RESOLVED_RELEASE_TAG:-v2.5}"
          SHORT_SHA="${GITHUB_SHA::7}"
          APK_SIZE=$(du -h negai.apk | cut -f1)

          NOTES=$(printf "### negai %s — Cinema & Anime 4K Player (RU / EN)\n\n[![Get it on Obtainium](https://raw.githubusercontent.com/ImranR98/Obtainium/main/assets/graphics/badge_obtainium.png)](https://apps.obtainium.imranr.dev/redirect?r=obtainium://add/https://github.com/%s)\n\n#### 🇷🇺 Изменения в релизе %s\n- **Обновлённая панель управления плеером**: кнопки нижней панели переведены на чистые компактные иконки без подписей, возле кнопки серий отображается только счётчик (например, 1/12), а усиление звука объединено внутри меню Аудио.\n- **Кнопка глав над полосой прокрутки и настройка пропуска опенинга**: главы вынесены слева над таймлайном с названием текущей главы (скрываются, если глав нет). Добавлен произвольный интервал пропуска опенинга и быстрая настройка долгим нажатием на кнопку пропуска.\n- **Масштабирование под DPI и таймер скрытия HUD**: добавлен автоучёт DPI экрана с плавным ползунком масштаба (75%%–140%%), настройка времени автоскрытия элементов (2–15 сек) и сброс таймера при прокрутке нижней панели.\n- **Сохранность позиции в PiP и подробности торрент-раздач**: исправлено сохранение позиции при закрытии окна «Картинка в картинке» и смене серий; в поиске торрентов добавлена шторка с полным названием, описанием и списком файлов раздачи.\n\n#### 🇬🇧 What's New in %s\n- **Redesigned Player Quick Bar**: clean icon-only bottom buttons, compact episode counter badge (e.g. 1/12), and unified Audio Boost inside the Audio menu.\n- **Chapters Pill Above Timeline & Custom Skip Intro**: current chapter title button positioned on the left above the seekbar (auto-hidden when no chapters exist); custom Skip Intro intervals with direct long-press configuration.\n- **DPI-Aware UI Scaling & HUD Auto-Hide Timer**: automatic screen DPI scaling with a smooth 75%%–140%% slider, configurable HUD timeout (2–15s), and scroll-aware timer reset.\n- **PiP Position Persistence & Detailed Torrent Info**: reliable position saving when closing PiP or switching episodes, plus a detailed torrent release bottom sheet with full title, description, and file list.\n\n---\n- **APK:** \`negai.apk\` (%s)\n- **Build / Commit:** \`#%s\` / \`%s\` (branch \`%s\`)\n- **Direct Download:** [negai.apk](https://github.com/%s/releases/latest/download/negai.apk)" "$TAG" "$GITHUB_REPOSITORY" "$TAG" "$TAG" "$APK_SIZE" "$GITHUB_RUN_NUMBER" "$SHORT_SHA" "$GITHUB_REF_NAME" "$GITHUB_REPOSITORY")

          gh release create "$TAG" negai.apk \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "negai ${TAG}" \
            --notes "$NOTES" \
            --latest

          REL_URL=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json url -q .url)
          echo "Published GitHub Release: $REL_URL"

          {
            echo "## GitHub Release опубликован"
            echo "- **Релиз:** [${TAG}](${REL_URL})"
            echo "- **APK:** \`negai.apk\` (${APK_SIZE})"
          } >> "$GITHUB_STEP_SUMMARY"
